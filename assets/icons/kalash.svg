<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="kalashGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8D6E10" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <linearGradient id="coconutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="100%" stop-color="#4E342E" />
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#D84315" />
    </radialGradient>
  </defs>

  <!-- Mango Leaves (Amra Pallava) -->
  <g fill="url(#leafGrad)" stroke="#1B5E20" stroke-width="0.8">
    <!-- Center Leaf -->
    <path d="M50 48 Q50 18 50 12 Q53 18 50 48" />
    <path d="M50 48 Q42 22 36 18 Q46 26 50 48" />
    <path d="M50 48 Q58 22 64 18 Q54 26 50 48" />
    <path d="M50 48 Q32 30 22 28 Q36 36 50 48" />
    <path d="M50 48 Q68 30 78 28 Q64 36 50 48" />
  </g>

  <!-- Sacred Coconut (Shrikhanda / Narikela) -->
  <g>
    <ellipse cx="50" cy="38" rx="14" ry="18" fill="url(#coconutGrad)" stroke="#3E2723" stroke-width="1" />
    <!-- Fibers & Tuft on top -->
    <path d="M50 20 Q48 10 50 6 Q52 10 50 20" stroke="#8D6E63" stroke-width="2" fill="none" />
    <path d="M48 20 Q44 12 42 8" stroke="#8D6E63" stroke-width="1.5" fill="none" />
    <path d="M52 20 Q56 12 58 8" stroke="#8D6E63" stroke-width="1.5" fill="none" />
    <!-- Three eyes of coconut -->
    <circle cx="46" cy="34" r="1.5" fill="#2E1C14" />
    <circle cx="54" cy="34" r="1.5" fill="#2E1C14" />
    <circle cx="50" cy="40" r="1.5" fill="#2E1C14" />
  </g>

  <!-- Brass Pot (Kumbha / Kalash body) -->
  <g fill="url(#kalashGold)" stroke="#8D6E10" stroke-width="1.2">
    <!-- Neck / Rim -->
    <path d="M34 50 L66 50 L62 58 L38 58 Z" />
    <!-- Pot Belly -->
    <path d="M38 58 C22 66, 18 92, 36 102 L64 102 C82 92, 78 66, 62 58 Z" />
    <!-- Pot Foot / Base -->
    <path d="M34 102 L66 102 L68 108 L32 108 Z" />
  </g>

  <!-- Sacred Swastika on Kalash -->
  <g stroke="#C2185B" stroke-width="2" stroke-linecap="square" fill="none">
    <path d="M50 72 L50 88" />
    <path d="M42 80 L58 80" />
    <path d="M50 72 L56 72" />
    <path d="M50 88 L44 88" />
    <path d="M42 80 L42 74" />
    <path d="M58 80 L58 86" />
  </g>

  <!-- Sacred Red Thread (Mauli / Kalava) around neck -->
  <line x1="36" y1="54" x2="64" y2="54" stroke="#D32F2F" stroke-width="3" />
  <line x1="37" y1="55" x2="63" y2="55" stroke="#FFEB3B" stroke-width="1" stroke-dasharray="2,2" />
</svg>
