<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8D6E10" />
    </linearGradient>
  </defs>

  <g transform="translate(100, 100)" stroke="url(#mandalaGold)" fill="none">
    <!-- Center Dot -->
    <circle cx="0" cy="0" r="4" fill="#D32F2F" stroke="none" />
    <circle cx="0" cy="0" r="10" stroke-width="1.2" />
    <circle cx="0" cy="0" r="18" stroke-width="1" stroke-dasharray="2,2" />

    <!-- 8 Inner Lotus Petals -->
    <!-- Loop 8 rotations -->
    <g stroke-width="1.2">
      <!-- 0 deg -->
      <path d="M0 -10 C-6 -24, 6 -24, 0 -36 C-6 -24, 6 -24, 0 -10" fill="url(#mandalaGold)" fill-opacity="0.1" />
      <!-- 45 deg -->
      <path d="M0 -10 C-6 -24, 6 -24, 0 -36 C-6 -24, 6 -24, 0 -10" transform="rotate(45)" fill="url(#mandalaGold)" fill-opacity="0.1" />
      <!-- 90 deg -->
      <path d="M0 -10 C-6 -24, 6 -24, 0 -36 C-6 -24, 6 -24, 0 -10" transform="rotate(90)" fill="url(#mandalaGold)" fill-opacity="0.1" />
      <!-- 135 deg -->
      <path d="M0 -10 C-6 -24, 6 -24, 0 -36 C-6 -24, 6 -24, 0 -10" transform="rotate(135)" fill="url(#mandalaGold)" fill-opacity="0.1" />
      <!-- 180 deg -->
      <path d="M0 -10 C-6 -24, 6 -24, 0 -36 C-6 -24, 6 -24, 0 -10" transform="rotate(180)" fill="url(#mandalaGold)" fill-opacity="0.1" />
      <!-- 225 deg -->
      <path d="M0 -10 C-6 -24, 6 -24, 0 -36 C-6 -24, 6 -24, 0 -10" transform="rotate(225)" fill="url(#mandalaGold)" fill-opacity="0.1" />
      <!-- 270 deg -->
      <path d="M0 -10 C-6 -24, 6 -24, 0 -36 C-6 -24, 6 -24, 0 -36" transform="rotate(270)" fill="url(#mandalaGold)" fill-opacity="0.1" />
      <!-- 315 deg -->
      <path d="M0 -10 C-6 -24, 6 -24, 0 -36 C-6 -24, 6 -24, 0 -10" transform="rotate(315)" fill="url(#mandalaGold)" fill-opacity="0.1" />
    </g>

    <!-- Ring at 38 -->
    <circle cx="0" cy="0" r="38" stroke-width="1" />
    <circle cx="0" cy="0" r="44" stroke-width="0.8" stroke-dasharray="3,3" />

    <!-- 16 Mid Tier Floral Points -->
    <g stroke-width="1.2">
      <!-- 16 points -->
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(22.5)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(45)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(67.5)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(90)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(112.5)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(135)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(157.5)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(180)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(202.5)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(225)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(247.5)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(270)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(292.5)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(315)" />
      <path d="M0 -44 Q-7 -56 0 -64 Q7 -56 0 -44" transform="rotate(337.5)" />
    </g>

    <!-- Outer Ring & Auspicious Dots -->
    <circle cx="0" cy="0" r="70" stroke-width="1.5" />
    <circle cx="0" cy="0" r="76" stroke-width="0.8" stroke-dasharray="2,4" />
    <circle cx="0" cy="0" r="82" stroke-width="1.2" />

    <!-- 8 Outer Sacred Flames / Kalash points -->
    <g fill="#D32F2F" stroke="none">
      <circle cx="0" cy="-86" r="3" />
      <circle cx="60.8" cy="-60.8" r="3" />
      <circle cx="86" cy="0" r="3" />
      <circle cx="60.8" cy="60.8" r="3" />
      <circle cx="0" cy="86" r="3" />
      <circle cx="-60.8" cy="60.8" r="3" />
      <circle cx="-86" cy="0" r="3" />
      <circle cx="-60.8" cy="-60.8" r="3" />
    </g>
  </g>
</svg>
