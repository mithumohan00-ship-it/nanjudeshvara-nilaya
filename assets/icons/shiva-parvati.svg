<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="divineGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#E5B94E" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8E6A12" />
    </linearGradient>
    <radialGradient id="divineAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFE082" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#D4AF37" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="parvatiSari" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2185B" />
      <stop offset="100%" stop-color="#6B0C32" />
    </linearGradient>
    <linearGradient id="shivaVastra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4E342E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Large Divine Aura Background -->
  <circle cx="160" cy="115" r="105" fill="url(#divineAura)" />
  <circle cx="160" cy="115" r="102" fill="none" stroke="url(#divineGold)" stroke-width="1.2" stroke-dasharray="4,4" />
  <circle cx="160" cy="115" r="95" fill="none" stroke="url(#divineGold)" stroke-width="0.8" />

  <!-- Trishula (Trident) & Damaru in Lord Shiva's background -->
  <g stroke="url(#divineGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Trishula staff -->
    <line x1="88" y1="25" x2="88" y2="210" stroke-width="3" />
    <!-- Central Prong -->
    <path d="M88 25 L88 6" />
    <path d="M88 6 Q89 12 91 16 Q88 18 88 25 Q88 18 85 16 Q87 12 88 6" fill="url(#divineGold)" />
    <!-- Left & Right Prongs -->
    <path d="M74 24 C74 40, 88 42, 88 42 C88 42, 102 40, 102 24" fill="none" stroke-width="2.5" />
    <path d="M74 24 Q72 16 75 14 Q77 18 78 24" fill="url(#divineGold)" />
    <path d="M102 24 Q104 16 101 14 Q99 18 98 24" fill="url(#divineGold)" />
    <!-- Damaru tied to Trishula -->
    <g transform="translate(88, 54)">
      <polygon points="-12,-8 12,-8 -12,8 12,8" fill="url(#divineGold)" stroke="url(#divineGold)" stroke-width="1.5" />
      <line x1="-12" y1="-8" x2="12" y2="8" stroke="#795548" stroke-width="1" />
      <line x1="-12" y1="8" x2="12" y2="-8" stroke="#795548" stroke-width="1" />
      <circle cx="0" cy="0" r="2.5" fill="#C2185B" />
      <!-- Damaru cords & bead -->
      <path d="M0 0 Q-8 8 -6 14" fill="none" stroke="url(#divineGold)" stroke-width="1.2" />
      <circle cx="-6" cy="14" r="1.8" fill="#FFF9C4" />
    </g>
  </g>

  <!-- Lord Shiva (Left Center) -->
  <g filter="url(#shadow)">
    <!-- Shiva Jatamukuta (Ascetic Crown of Matted Locks) -->
    <path d="M112 50 C110 32, 134 30, 134 50 Z" fill="#3E2723" stroke="url(#divineGold)" stroke-width="1.5" />
    <!-- Crescent Moon (Chandrama) in Jata -->
    <path d="M110 38 A 9 9 0 0 0 118 48 A 7 7 0 0 1 110 38" fill="#FFF9C4" stroke="url(#divineGold)" stroke-width="0.75" />
    <!-- Sacred Ganga spray -->
    <path d="M132 34 Q138 28 142 32 Q136 36 134 40" fill="none" stroke="#80D8FF" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Shiva Face Outline -->
    <path d="M112 50 C106 66, 110 82, 124 88 C132 88, 140 80, 142 68 C144 56, 138 50, 134 50" fill="#FFF8E7" stroke="url(#divineGold)" stroke-width="1.8" />
    
    <!-- Tripundra (Three Sacred Ash Lines on Forehead) -->
    <path d="M116 57 Q123 55 130 57" stroke="#ECEFF1" stroke-width="1.8" stroke-linecap="round" />
    <path d="M117 60 Q123 58 129 60" stroke="#ECEFF1" stroke-width="1.8" stroke-linecap="round" />
    <path d="M118 63 Q123 61 128 63" stroke="#ECEFF1" stroke-width="1.8" stroke-linecap="round" />
    <!-- Trinetra (Third Eye) & Vermilion Dot -->
    <path d="M123 56 Q125 60 123 64 Q121 60 123 56 Z" fill="#D32F2F" />
    
    <!-- Eyes - Calm, Meditative -->
    <path d="M114 68 Q118 71 121 68" fill="none" stroke="#4E342E" stroke-width="1.5" stroke-linecap="round" />
    <path d="M126 68 Q129 71 132 68" fill="none" stroke="#4E342E" stroke-width="1.5" stroke-linecap="round" />
    <!-- Gentle Smile -->
    <path d="M120 78 Q124 81 127 78" fill="none" stroke="#8D6E63" stroke-width="1.2" stroke-linecap="round" />
    
    <!-- Kundala (Earring) -->
    <circle cx="111" cy="74" r="3.5" fill="url(#divineGold)" stroke="#6D4C41" stroke-width="0.8" />

    <!-- Neelkanta (Blue Throat) & Vasuki (Serpent) -->
    <path d="M120 88 C116 96, 128 98, 128 88" fill="#80DEEA" opacity="0.4" />
    <path d="M116 90 Q124 95 134 92 Q140 88 142 98 Q130 102 118 96" fill="none" stroke="#43A047" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="142,98 145,95 146,99" fill="#2E7D32" />

    <!-- Rudraksha Mala -->
    <path d="M112 102 Q124 116 136 102" fill="none" stroke="#6D4C41" stroke-width="3" stroke-dasharray="3,3" />

    <!-- Shiva Shoulders & Torso -->
    <path d="M112 90 C96 102, 92 128, 94 155 L144 155 C146 128, 142 102, 134 90 Z" fill="#FFF3E0" stroke="url(#divineGold)" stroke-width="1.5" />
    <!-- Angavastra (Golden/Saffron Shawl) -->
    <path d="M94 118 C102 124, 114 135, 118 155 L94 155 Z" fill="url(#shivaVastra)" opacity="0.9" />

    <!-- Abhaya Mudra (Blessing Hand of Shiva) -->
    <g transform="translate(100, 116)">
      <path d="M0 16 C-4 12, -4 2, 0 0 C4 2, 4 12, 0 16 Z" fill="#FFE0B2" stroke="url(#divineGold)" stroke-width="1" />
      <circle cx="0" cy="8" r="2" fill="#D32F2F" />
    </g>
  </g>

  <!-- Goddess Parvati (Right Center) -->
  <g filter="url(#shadow)">
    <!-- Parvati Golden Crown (Kirita Mukuta) -->
    <path d="M184 48 C186 32, 206 32, 208 48 Z" fill="url(#divineGold)" stroke="#B78103" stroke-width="1.2" />
    <polygon points="196,28 191,38 201,38" fill="url(#divineGold)" />
    <circle cx="196" cy="27" r="2.5" fill="#D32F2F" />
    <circle cx="196" cy="40" r="2" fill="#1B5E20" />
    <circle cx="190" cy="42" r="1.5" fill="#D32F2F" />
    <circle cx="202" cy="42" r="1.5" fill="#D32F2F" />

    <!-- Parvati Hair / Braid (Keshapasha) -->
    <path d="M182 48 C176 56, 178 72, 180 84 C184 66, 184 54, 184 48 Z" fill="#212121" />
    <path d="M208 48 C216 58, 218 78, 222 92 C216 76, 212 56, 208 48 Z" fill="#212121" />
    <!-- Jasmine Flowers in hair (Mullai / Mallige) -->
    <circle cx="180" cy="56" r="2" fill="#FFFFFF" />
    <circle cx="178" cy="62" r="2" fill="#FFFFFF" />
    <circle cx="177" cy="68" r="2" fill="#FFFFFF" />

    <!-- Parvati Face Outline -->
    <path d="M184 48 C180 62, 184 78, 196 84 C206 84, 212 74, 208 48 Z" fill="#FFF3E0" stroke="url(#divineGold)" stroke-width="1.8" />

    <!-- Radiant Kumkum Bindi & Chandrakala -->
    <circle cx="196" cy="58" r="2.8" fill="#C2185B" />
    <circle cx="196" cy="54" r="1" fill="#FFEB3B" />

    <!-- Graceful Eyes (Meenakshi / Lotus eyes) -->
    <path d="M186 64 Q190 68 193 64" fill="none" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round" />
    <path d="M199 64 Q202 68 206 64" fill="none" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round" />
    <!-- Traditional Nose Ring (Mookuthi / Nath) -->
    <circle cx="192" cy="70" r="1.5" fill="url(#divineGold)" />
    <!-- Gentle Loving Smile -->
    <path d="M193 75 Q196 78 199 75" fill="none" stroke="#C2185B" stroke-width="1.4" stroke-linecap="round" />

    <!-- Golden Kundala / Jhumka -->
    <path d="M210 68 L213 74 L207 74 Z" fill="url(#divineGold)" />
    <circle cx="210" cy="76" r="1.5" fill="#C2185B" />

    <!-- Mangalsutra & Gold Necklaces (Kantha Hara) -->
    <path d="M188 88 Q196 96 204 88" fill="none" stroke="url(#divineGold)" stroke-width="2.5" />
    <circle cx="196" cy="94" r="2" fill="#C2185B" />

    <!-- Rich Festive Sari (Deep Maroon & Antique Gold Zari) -->
    <path d="M184 88 C172 100, 168 128, 170 155 L226 155 C228 128, 222 100, 208 88 Z" fill="url(#parvatiSari)" stroke="url(#divineGold)" stroke-width="1.5" />
    <!-- Gold Zari Pallu Border -->
    <path d="M180 105 Q196 112 216 100" stroke="url(#divineGold)" stroke-width="3" fill="none" />
    <path d="M174 125 Q196 132 222 120" stroke="url(#divineGold)" stroke-width="2.5" fill="none" />

    <!-- Lotus Flower held in hand -->
    <g transform="translate(222, 115)" filter="url(#shadow)">
      <path d="M0 0 C-4 -6, -8 -2, 0 8 C8 -2, 4 -6, 0 0 Z" fill="#E91E63" stroke="url(#divineGold)" stroke-width="0.8" />
      <path d="M-5 -2 C-10 -4, -6 6, 0 8" fill="#F06292" />
      <path d="M5 -2 C10 -4, 6 6, 0 8" fill="#F06292" />
      <line x1="0" y1="8" x2="0" y2="28" stroke="#2E7D32" stroke-width="2" />
    </g>
  </g>

  <!-- Sacred Pedestal / Lotus Throne (Peetha) -->
  <g fill="url(#divineGold)" filter="url(#shadow)">
    <!-- Upper rim -->
    <path d="M70 162 C110 156, 210 156, 250 162 L246 172 C210 167, 110 167, 74 172 Z" opacity="0.95" />
    <!-- Inverted Lotus Petals -->
    <path d="M78 172 Q86 182 94 172 Q102 182 110 172 Q118 182 126 172 Q134 182 142 172 Q150 182 158 172 Q166 182 174 172 Q182 182 190 172 Q198 182 206 172 Q214 182 222 172 Q230 182 238 172 Q244 178 246 172 Z" fill="#8E6A12" />
    <!-- Lower base -->
    <rect x="74" y="174" width="172" height="8" rx="2" fill="url(#divineGold)" />
  </g>

  <!-- Divine Holy Cow (Kamadhenu / Nandi Bull presence silhouette indicator) -->
  <g opacity="0.85" transform="translate(48, 138) scale(0.65)">
    <!-- Nandi Horns & Head resting in adoration -->
    <path d="M30 40 C24 35, 14 36, 12 44 C10 50, 16 56, 24 58 L38 58 C42 50, 36 44, 30 40 Z" fill="#FFF8E7" stroke="url(#divineGold)" stroke-width="2" />
    <path d="M18 36 C16 26, 12 24, 8 26 C12 30, 14 34, 16 38 Z" fill="url(#divineGold)" />
    <path d="M26 36 C28 26, 32 24, 36 26 C32 30, 30 34, 28 38 Z" fill="url(#divineGold)" />
    <!-- Bell collar -->
    <path d="M22 56 Q30 62 36 56" stroke="url(#divineGold)" stroke-width="3" fill="none" />
    <circle cx="29" cy="62" r="2.5" fill="#D32F2F" />
  </g>

  <!-- Auspicious Sanskrit / Kannada Text banner below -->
  <text x="160" y="206" text-anchor="middle" font-family="'Tiro Kannada', 'Noto Serif Kannada', Georgia, serif" font-size="13" font-weight="bold" fill="#6B1724" letter-spacing="1">
    ॥ ಶ್ರೀ ಗೌರೀಶಂಕರಾಯ ನಮಃ ॥
  </text>
  <text x="160" y="224" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="9" font-weight="600" fill="#8E6A12" letter-spacing="2">
    DIVINE BLESSINGS OF LORD SHIVA &amp; GODDESS PARVATI
  </text>
</svg>
